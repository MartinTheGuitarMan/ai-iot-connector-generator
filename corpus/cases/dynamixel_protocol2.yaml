id: dynamixel_protocol2
name: 'ROBOTIS Dynamixel Protocol 2.0 (servo bus): FF FF FD 00, CRC-16 low byte first'
source: https://emanual.robotis.com/docs/en/dxl/protocol2/ (24 complete example packets; partial fast-sync statuses left out)
doc_rule: 16-bit CRC over header..parameters; the page points to a separate CRC page. The CRC is poly 8005, init 0, no reflection, no final XOR, low byte first (checked by computing all 24 frames)
note: Byte stuffing (FF FF FD -> FF FF FD FD) is documented but no example packet contains it, so insertion stuffing is untested. Frames transcribed through a page summariser, then verified by computing every CRC; all 24 pass.
