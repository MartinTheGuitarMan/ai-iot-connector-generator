id: dsmr_p1_v42
name: DSMR 4.2 P1 smart-meter telegram (Dutch/Belgian electricity and gas meters)
source: https://github.com/ndokter/dsmr_parser/blob/master/test/example_telegrams.py (TELEGRAM_V4_2, CRLF line endings, CRC !6796); the same telegram is the example in the DSMR P1 companion standard
doc_rule: 'CRC-16 (poly 0x8005, init 0, reflected, i.e. CRC-16/ARC) over all text from the leading / up to and including the !, written as 4 upper-case hex characters after the !. Verified by computing: 6796 over the 887 bytes.'
note: 'One text frame of 887 bytes, so only 16 bits of evidence: low confidence. The CRC is written as hex text and computed over the ASCII characters, so the plain binary search finds only chance CRC-8 matches (it misses the real rule). Failure fixed by extending the hex-text pass with CRC-8/16/32 over the ASCII. Not covered: meters whose CRC drops leading zeros (the dsmr_parser test file has a TELEGRAM_UNPADDED_CRC ending !B9F). Spec example CRCs are not always right (an Arduino forum thread found that), so only a frame whose CRC was verified by computing is used.'
frames:
- 
reference:
  algo: ascii_hex_crc16
  width_chars: 4
  start: 0
