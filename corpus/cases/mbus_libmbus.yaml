doc_rule: sum of bytes C..end of data, mod 256, one byte, followed by 0x16; length byte repeated at offsets 1 and 2; frame = length + 6
note: 'Found blind from all 80 telegrams: length rule offset 1 (and 2), +6; sum8 from byte 4, trailer 0x16. Only the 10 shortest are stored.'
