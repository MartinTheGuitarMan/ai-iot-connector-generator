id: whoop_crc32
name: 'WHOOP strap BLE packets: AA, length, header CRC-8, payload, CRC-32'
source: https://www.mintlify.com/bWanShiTong/reverse-engineering-whoop-post/protocol/checksum-crc (six packet/checksum pairs)
doc_rule: Source page documents CRC-32 poly 04C11DB7, init 0, reflected, xorout F43F44AC over all bytes. That only fits the four same-header packets; the two short ones fail it. Plain CRC-32 (zlib) over the payload starting at byte 4 fits all six.
note: 'Page parameters were wrong, the blind result is right: a constant header absorbs into a custom xorout. Stored little-endian.'
