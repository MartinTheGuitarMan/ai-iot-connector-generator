protocol: wx_ascii
transport: delimited_text
delimiter: ","

message:
  id: WXOBSF
  match_suffix: "WXOBSF"
  description: "Weather station observation with self-contained date (wind)"

fields:
  - name: obs_time
    index: 1
    type: hms_time
  - name: status
    index: 2
    type: str
  - name: site_lat
    index: 3
    type: dm_lat
  - name: site_lat_dir
    index: 4
    type: str
  - name: site_lon
    index: 5
    type: dm_lon
  - name: site_lon_dir
    index: 6
    type: str
  - name: wind_speed_kmh
    index: 7
    type: float
  - name: wind_dir_deg
    index: 8
    type: int
  - name: obs_date
    index: 9
    type: ddmmyy_date

canonical:
  timestamp_field: obs_time
  date_field: obs_date
  location:
    lat_field: site_lat
    lat_dir_field: site_lat_dir
    lon_field: site_lon
    lon_dir_field: site_lon_dir
  measurements:
    - name: wind_speed_kmh
      field: wind_speed_kmh
      unit: kmh
    - name: wind_dir_deg
      field: wind_dir_deg
      unit: degrees
