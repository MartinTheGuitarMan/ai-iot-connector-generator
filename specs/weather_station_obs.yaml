protocol: wx_ascii
transport: delimited_text
delimiter: ","

message:
  id: WXOBS
  match_suffix: "WXOBS"
  description: "Weather station observation (time-of-day only, no date)"

fields:
  - name: obs_time
    index: 1
    type: hms_time
  - name: site_lat
    index: 2
    type: dm_lat
  - name: site_lat_dir
    index: 3
    type: str
  - name: site_lon
    index: 4
    type: dm_lon
  - name: site_lon_dir
    index: 5
    type: str
  - name: temperature_c
    index: 6
    type: float
  - name: humidity_pct
    index: 7
    type: float
  - name: pressure_hpa
    index: 8
    type: float

canonical:
  timestamp_field: obs_time
  location:
    lat_field: site_lat
    lat_dir_field: site_lat_dir
    lon_field: site_lon
    lon_dir_field: site_lon_dir
  measurements:
    - name: temperature_c
      field: temperature_c
      unit: celsius
    - name: humidity_pct
      field: humidity_pct
      unit: percent
    - name: pressure_hpa
      field: pressure_hpa
      unit: hpa
