apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-iot
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: iot
      defaultBucket: telemetry
      tlsSkipVerify: true
    # Local-dev-only placeholder token — see docker-compose.yml.
    secureJsonData:
      token: devtoken-not-a-secret
